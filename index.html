<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Realsim</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101722;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  canvas{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none}
  #ui{position:fixed;inset:0;pointer-events:none}
  .top{
    position:absolute;top:12px;left:12px;right:12px;
    display:flex;align-items:center;justify-content:space-between;gap:8px;
  }
  .panel{
    background:rgba(12,18,28,.88);border:2px solid rgba(255,255,255,.12);
    color:white;border-radius:14px;padding:9px 12px;box-shadow:0 8px 24px #0005;
    backdrop-filter:blur(8px);pointer-events:auto;
  }
  #title{font-weight:900;letter-spacing:.5px}
  #stats{font-size:12px;line-height:1.35}
  #tools{
    position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
    display:flex;gap:7px;max-width:96vw;overflow:auto;padding:6px;
    background:rgba(12,18,28,.9);border:2px solid rgba(255,255,255,.12);
    border-radius:17px;pointer-events:auto;box-shadow:0 8px 28px #0007;
  }
  button{
    border:0;border-radius:11px;padding:10px 12px;background:#263449;color:white;
    font-weight:800;white-space:nowrap;cursor:pointer
  }
  button.active{background:#54b7ff;color:#07111d}
  button:active{transform:scale(.96)}
  #hint{
    position:absolute;left:50%;top:74px;transform:translateX(-50%);
    color:#fff;background:#0008;border-radius:12px;padding:8px 12px;font-size:12px;
    pointer-events:none;text-align:center
  }
  #personCard{
    position:absolute;right:12px;bottom:80px;width:min(270px,calc(100vw - 24px));
    display:none
  }
  .trait{display:inline-block;background:#263449;border-radius:8px;padding:4px 7px;margin:3px 2px;font-size:11px}
</style>
</head>
<body>
<canvas id="world"></canvas>
<div id="ui">
  <div class="top">
    <div class="panel" id="title">🌎 REALSIM</div>
    <div class="panel" id="stats">Water world</div>
  </div>
  <div id="hint">Pick a tool, then tap or drag on the world.</div>
  <div id="tools">
    <button class="active" data-tool="land">🏝️ Add Land</button>
    <button data-tool="erase">🌊 Water</button>
    <button data-tool="tree">🌳 Trees</button>
    <button data-tool="people">👤 People</button>
    <button data-tool="house">🏠 House</button>
    <button id="pause">⏸ Pause</button>
    <button id="reset">↻ New World</button>
  </div>
  <div class="panel" id="personCard"></div>
</div>

<script>
"use strict";

const canvas = document.getElementById("world");
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;

let W=0,H=0,DPR=1;
let cell=12;
let cols=0,rows=0;
let terrain=[];
let trees=[];
let houses=[];
let people=[];
let year=1;
let paused=false;
let selectedTool="land";
let selectedPerson=null;
let last=performance.now();
let spawnTimer=0;

const TRAITS=[
  "Curious","Friendly","Brave","Hardworking","Fast","Calm","Social","Explorer"
];
const SKIN=["#f0b38a","#d99168","#a96745","#7a4935"];
const HAIR=["#33251e","#5b3825","#171717","#8a5a32","#d5a34b"];
const SHIRT=["#e45757","#4b82e8","#58a866","#d39b3d","#9b65c7","#e4e4e4"];

function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=innerWidth; H=innerHeight;
  canvas.width=Math.floor(W*DPR);
  canvas.height=Math.floor(H*DPR);
  canvas.style.width=W+"px"; canvas.style.height=H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
  cell=Math.max(8,Math.floor(Math.min(W,H)/48));
  cols=Math.ceil(W/cell)+2;
  rows=Math.ceil(H/cell)+2;
  makeWaterWorld();
}
addEventListener("resize",resize);

function makeWaterWorld(){
  terrain=Array.from({length:rows},()=>Array(cols).fill(0));
  trees=[]; houses=[]; people=[]; year=1; selectedPerson=null;
  // A few tiny starter sand pixels keep the map visually alive, but it is still
  // essentially an ocean until the player adds land.
  for(let i=0;i<6;i++){
    const x=2+Math.floor(Math.random()*(cols-4));
    const y=2+Math.floor(Math.random()*(rows-4));
    terrain[y][x]=1;
  }
}

function inside(x,y){return x>=0&&y>=0&&x<cols&&y<rows}
function isLand(x,y){return inside(x,y)&&terrain[y][x]>0}

function screenCell(e){
  const r=canvas.getBoundingClientRect();
  return {
    x:Math.floor((e.clientX-r.left)/cell),
    y:Math.floor((e.clientY-r.top)/cell)
  };
}

function paint(e){
  const {x,y}=screenCell(e);
  if(!inside(x,y))return;
  if(selectedTool==="land"){
    brush(x,y,1);
  } else if(selectedTool==="erase"){
    brush(x,y,0);
  } else if(selectedTool==="tree"){
    if(isLand(x,y)) addTree(x,y);
  } else if(selectedTool==="people"){
    if(isLand(x,y) && people.length<250) createPerson(x+.5,y+.5,[]);
  } else if(selectedTool==="house"){
    if(isLand(x,y)) addHouse(x,y);
  }
}
let painting=false;
canvas.addEventListener("pointerdown",e=>{painting=true;canvas.setPointerCapture(e.pointerId);paint(e)});
canvas.addEventListener("pointermove",e=>{if(painting)paint(e)});
canvas.addEventListener("pointerup",()=>painting=false);
canvas.addEventListener("pointercancel",()=>painting=false);

function brush(cx,cy,val){
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
    const x=cx+dx,y=cy+dy;
    if(inside(x,y))terrain[y][x]=val;
  }
}

function addTree(x,y){
  if(trees.some(t=>t.x===x&&t.y===y))return;
  trees.push({x,y,age:0});
}
function addHouse(x,y){
  if(houses.some(h=>Math.hypot(h.x-x,h.y-y)<1.2))return;
  houses.push({x,y,age:0});
}

function randomTraits(){
  const out=[];
  for(const t of TRAITS) if(Math.random()<.23)out.push({name:t});
  if(!out.length) out.push({name:TRAITS[Math.floor(Math.random()*TRAITS.length)]});
  return out;
}
function has(p,name){return p.traits.some(t=>t.name===name)}

function createPerson(x,y,parents){
  const traits=parents.length
    ? inheritedTraits(parents)
    : randomTraits();

  const p={
    id:crypto.randomUUID?crypto.randomUUID():String(Math.random()),
    x,y,age:parents.length?0:18+Math.random()*34,
    direction:Math.random()*Math.PI*2,
    speed:.018+Math.random()*.014,
    baseSpeed:0,
    traits,
    skin:parents.length?(Math.random()<.5?parents[0].skin:parents[1].skin):SKIN[Math.floor(Math.random()*SKIN.length)],
    hair:parents.length?(Math.random()<.5?parents[0].hair:parents[1].hair):HAIR[Math.floor(Math.random()*HAIR.length)],
    shirt:SHIRT[Math.floor(Math.random()*SHIRT.length)],
    alive:true,
    home:null
  };
  p.baseSpeed=p.speed;
  people.push(p);
  return p;
}
function inheritedTraits(parents){
  const out=[];
  for(const t of TRAITS){
    if(parents.some(p=>has(p,t)) && Math.random()<.72)out.push({name:t});
    else if(Math.random()<.06)out.push({name:t});
  }
  if(!out.length)out.push({name:TRAITS[Math.floor(Math.random()*TRAITS.length)]});
  return out;
}

function adult(p){return p.age>=18&&p.age<65}
function nearestFriend(p){
  let best=null,bd=9;
  for(const q of people){
    if(q===p||!q.alive)continue;
    const d=Math.hypot(q.x-p.x,q.y-p.y);
    if(d<bd){bd=d;best=q}
  }
  return best;
}

function update(dt){
  if(paused)return;

  // Simulation speed is intentionally gentle so the tiny world is watchable.
  const steps=3;
  for(let s=0;s<steps;s++){
    for(const p of people){
      if(!p.alive)continue;
      p.age += 1/(60*60*24*30*12);

      let turn=.012;
      if(has(p,"Curious"))turn=.025;
      if(Math.random()<turn)p.direction+=(Math.random()-.5)*(has(p,"Curious")?2.5:1.5);

      if(has(p,"Friendly")||has(p,"Social")){
        const f=nearestFriend(p);
        if(f){
          const target=Math.atan2(f.y-p.y,f.x-p.x);
          p.direction += Math.atan2(Math.sin(target-p.direction),Math.cos(target-p.direction))*.08;
        }
      }

      let movement=p.baseSpeed;
      if(has(p,"Hardworking"))movement*=.95;
      if(has(p,"Fast"))movement*=1.3;
      if(has(p,"Brave"))movement*=1.08;

      const nx=p.x+Math.cos(p.direction)*movement;
      const ny=p.y+Math.sin(p.direction)*movement;

      if(!isLand(Math.floor(nx),Math.floor(ny))){
        p.direction+=Math.PI*(.6+Math.random()*.5);
      }else{
        p.x=nx;p.y=ny;
      }

      // People can settle near land and make a home.
      if(adult(p)&&!p.home&&Math.random()<.00035&&houses.length<70){
        const hx=Math.floor(p.x),hy=Math.floor(p.y);
        if(isLand(hx,hy)){
          addHouse(hx,hy);
          p.home=houses[houses.length-1];
        }
      }
    }

    // Slow natural population growth, using the traits/parents system.
    if(people.length<250 && Math.random()<.0009){
      const adults=people.filter(p=>adult(p));
      if(adults.length>=2){
        const a=adults[Math.floor(Math.random()*adults.length)];
        let b=adults[Math.floor(Math.random()*adults.length)];
        if(a!==b){
          createPerson(Math.floor((a.x+b.x)/2),Math.floor((a.y+b.y)/2),[a,b]);
        }
      }
    }

    // Tiny chance for nature to appear naturally once land exists.
    if(trees.length<180 && Math.random()<.002){
      const x=1+Math.floor(Math.random()*(cols-2));
      const y=1+Math.floor(Math.random()*(rows-2));
      if(isLand(x,y))addTree(x,y);
    }

    year+=1/12000;
  }
}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle="#2277b9";
  ctx.fillRect(0,0,W,H);

  for(let y=0;y<rows;y++){
    for(let x=0;x<cols;x++){
      const px=x*cell,py=y*cell;
      if(terrain[y][x]){
        const nearWater =
          !isLand(x-1,y)||!isLand(x+1,y)||!isLand(x,y-1)||!isLand(x,y+1);
        ctx.fillStyle=nearWater?"#77b957":"#63a94d";
        ctx.fillRect(px,py,cell,cell);
        if(Math.random()<0.0004){
          ctx.fillStyle="#86c866";
          ctx.fillRect(px+2,py+2,2,2);
        }
      }else{
        ctx.fillStyle="#2581c4";
        ctx.fillRect(px,py,cell,cell);
      }
    }
  }

  // Pixel trees.
  for(const t of trees){
    const x=t.x*cell,y=t.y*cell;
    ctx.fillStyle="#68452b";
    ctx.fillRect(x+cell*.42,y+cell*.48,Math.max(2,cell*.16),cell*.42);
    ctx.fillStyle="#2e7d3c";
    ctx.fillRect(x+cell*.15,y+cell*.16,cell*.7,cell*.52);
    ctx.fillStyle="#3d994b";
    ctx.fillRect(x+cell*.28,y+cell*.05,cell*.42,cell*.35);
  }

  // Pixel houses.
  for(const h of houses){
    const x=h.x*cell,y=h.y*cell;
    ctx.fillStyle="#d6a05b";
    ctx.fillRect(x+1,y+cell*.38,cell-2,cell*.5);
    ctx.fillStyle="#8b4c39";
    ctx.beginPath();
    ctx.moveTo(x,y+cell*.4);ctx.lineTo(x+cell/2,y+1);ctx.lineTo(x+cell,y+cell*.4);ctx.closePath();ctx.fill();
    ctx.fillStyle="#75b6d6";
    ctx.fillRect(x+cell*.42,y+cell*.55,cell*.16,cell*.22);
  }

  // Chunky pixel people.
  for(const p of people){
    if(!p.alive)continue;
    drawPerson(p);
  }

  updateStats();
}

function drawPerson(p){
  const x=Math.round(p.x*cell), y=Math.round(p.y*cell);
  const scale=Math.max(1,Math.floor(cell/6));
  const w=5*scale,h=7*scale;
  const bob=Math.floor((performance.now()/180)%2)*scale;
  ctx.save();
  ctx.translate(x-w/2,y-h/2-bob);

  // Shadow
  ctx.fillStyle="#0004";
  ctx.fillRect(-w*.45,h*.82,w*.9,scale);

  // Legs
  ctx.fillStyle="#493a35";
  ctx.fillRect(scale*1,scale*5,scale*1.3,scale*2);
  ctx.fillRect(scale*3,scale*5,scale*1.3,scale*2);

  // Shirt/body
  ctx.fillStyle=p.shirt;
  ctx.fillRect(scale*.7,scale*2.5,scale*3.7,scale*3);

  // Arms
  ctx.fillRect(0,scale*3,scale,scale*2.2);
  ctx.fillRect(scale*4,scale*3,scale,scale*2.2);

  // Head
  ctx.fillStyle=p.skin;
  ctx.fillRect(scale*1,scale*.7,scale*3,scale*2.2);

  // Hair
  ctx.fillStyle=p.hair;
  ctx.fillRect(scale*1,0,scale*3.2,scale*.95);
  ctx.fillRect(scale*.7,scale*.55,scale*.8,scale*1.3);

  // One-pixel face detail
  ctx.fillStyle="#202020";
  ctx.fillRect(scale*3.25,scale*1.45,Math.max(1,scale*.45),Math.max(1,scale*.45));

  ctx.restore();

  if(selectedPerson===p){
    ctx.strokeStyle="#fff";
    ctx.lineWidth=2;
    ctx.strokeRect(x-w/2-3,y-h/2-3,w+6,h+6);
  }
}

function updateStats(){
  const land=terrain.flat().filter(Boolean).length;
  const pop=people.filter(p=>p.alive).length;
  document.getElementById("stats").innerHTML=
    `Year ${Math.floor(year)} · 👤 ${pop} · 🏠 ${houses.length} · 🌳 ${trees.length} · 🟩 ${land}`;
}

function selectPersonAt(e){
  if(selectedTool!=="people")return;
  const {x,y}=screenCell(e);
  let best=null,bd=1.3;
  for(const p of people){
    const d=Math.hypot(p.x-x,p.y-y);
    if(d<bd){bd=d;best=p}
  }
  if(best){
    selectedPerson=best;
    showPerson(best);
  }
}
canvas.addEventListener("click",e=>{
  if(selectedTool==="people")selectPersonAt(e);
});

function showPerson(p){
  const card=document.getElementById("personCard");
  card.style.display="block";
  card.innerHTML=
    `<b>👤 Person</b><br>
     Age: ${Math.floor(p.age)}<br>
     Traits:<br>${p.traits.map(t=>`<span class="trait">${t.name}</span>`).join("")}`;
  setTimeout(()=>{if(selectedPerson===p)card.style.display="none"},5000);
}

document.querySelectorAll("[data-tool]").forEach(btn=>{
  btn.addEventListener("click",()=>{
    selectedTool=btn.dataset.tool;
    document.querySelectorAll("[data-tool]").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    const names={land:"Add Land",erase:"Water",tree:"Trees",people:"People",house:"House"};
    document.getElementById("hint").textContent=
      selectedTool==="people"
      ? "Tap a person to inspect them, or drag to place people."
      : `${names[selectedTool]} selected. Tap or drag on the world.`;
  });
});

document.getElementById("pause").addEventListener("click",e=>{
  paused=!paused;
  e.target.textContent=paused?"▶ Resume":"⏸ Pause";
});
document.getElementById("reset").addEventListener("click",()=>{
  if(confirm("Start a brand-new water world?"))makeWaterWorld();
});

function loop(now){
  const dt=Math.min(.05,(now-last)/1000);
  last=now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
